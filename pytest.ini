[pytest]
addopts = -ra --html=reports/test-report.html --self-contained-html
testpaths = tests
markers =
    login: tests for the OrangeHRM login module
    admin: tests for the OrangeHRM Admin module
    dashboard: tests for the OrangeHRM dashboard module
    pim: tests for the OrangeHRM PIM module
    leave: tests for the OrangeHRM Leave module
    time: tests for the OrangeHRM Time module
    recruitment: tests for the OrangeHRM Recruitment module
    performance: tests for the OrangeHRM Performance module
    my_info: tests for the OrangeHRM My Info module
    claim: tests for the OrangeHRM Claim module
    directory: tests for the OrangeHRM Directory module
    buzz: tests for the OrangeHRM Buzz module
    smoke: essential happy-path tests
    regression: negative and broader behavior tests
